# Known-vulnerability audit of the backend's and the frontend's runtime
# dependencies, on every push and PR and every Monday (a CVE can be published
# without anything changing here). Its own workflow, so a finding marks the
# commit red but never holds up ci.yml's deploy (documentation/deployment.md
# "CI and deploy").
name: Audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"  # same as backend/Dockerfile
      # The locked, hashed production packages, audited as-is (--disable-pip:
      # nothing is resolved or installed).
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
      - run: uvx pip-audit@2.10.1 --strict --disable-pip -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Only what ends up in the browser bundles; high and critical only.
      - run: npm audit --omit=dev --audit-level=high
