<section class="surface filters">
  <div class="search-row">
    <ng-content />
  </div>
  <div class="rarity-row">
    <div class="rarity-toggle-row">
      <button
        type="button"
        class="rarity-toggle-btn"
        [class.active]="selectedRarities.size === 0"
        [attr.aria-pressed]="selectedRarities.size === 0"
        [attr.aria-label]="'sets.allRarities' | translate"
        [title]="'sets.allRarities' | translate"
        (click)="raritiesChange.emit(newSet())"
      >
        <ab-icon name="layers" />
      </button>
      @for (category of rarities; track category) {
        <button
          type="button"
          class="rarity-toggle-btn"
          [class.active]="selectedRarities.has(category)"
          [attr.aria-pressed]="selectedRarities.has(category)"
          [attr.aria-label]="category"
          [title]="category"
          (click)="toggleRarity(category)"
        >
          <img [src]="rarityIcon(category)" [alt]="category" (error)="onRarityIconError($event)" />
          <span class="rarity-fallback">{{ category }}</span>
        </button>
      }
    </div>
  </div>
  <div class="reverse-filters" [attr.aria-label]="'filters.printVariant' | translate">
    <button
      type="button"
      class="rarity-toggle-btn"
      [class.active]="selectedVariants.length === 0"
      [attr.aria-pressed]="selectedVariants.length === 0"
      [attr.aria-label]="'sets.allVariants' | translate"
      [title]="'sets.allVariants' | translate"
      (click)="toggleVariant('all')"
    >
      <ab-icon name="layers" />
    </button>
    @for (variant of variants; track variant) {
      <button
        type="button"
        class="rarity-toggle-btn"
        [class.active]="selectedVariants.includes(variant)"
        [attr.aria-pressed]="selectedVariants.includes(variant)"
        [attr.aria-label]="variantLabels[variant]"
        [title]="variantLabels[variant]"
        (click)="toggleVariant(variant)"
      >
        <img [src]="variantIcon(variant)" [alt]="variantLabels[variant]" />
      </button>
    }
  </div>
</section>
