<section class="surface filters">
  <div class="search-row">
    <ng-content />
  </div>
  <app-print-filters
    [rarities]="rarities"
    [variants]="variants"
    [selectedRarities]="selectedRarityList"
    [selectedVariants]="selectedVariants"
    (raritiesChange)="raritiesChange.emit(toSet($event))"
    (variantsChange)="variantsChange.emit($event)"
  />
</section>
