<div
  class="card-tile"
  [class.not-owned]="notOwned"
  [class.not-clickable]="!clickable"
  (click)="onClick()"
>
  <img [src]="imageUrl" [alt]="alt" loading="lazy" />
  @if (numberBadge) {
    <span class="number-badge" [class.secret]="secretNumber">{{ numberBadge }}</span>
  }
  @if (ownedQty > 0) {
    <span class="owned-badge">×{{ ownedQty }}</span>
    @if (reverseQty > 0) {
      <span class="reverse-badge">R×{{ reverseQty }}</span>
    }
  }
  @if (incomingQty > 0) {
    <span
      class="incoming-badge"
      [class.below-owned]="ownedQty > 0"
      [class.below-reverse]="ownedQty > 0 && reverseQty > 0"
      >{{ 'sets.incomingBadge' | translate: { count: incomingQty } }}</span
    >
  }
  <div class="card-info">
    <strong>{{ title }}</strong>
    <span>{{ subLabel }}</span>
  </div>
  <div class="qty-controls-group" (click)="$event.stopPropagation()">
    <ng-content></ng-content>
  </div>
</div>
