<div class="modal-backdrop" [class.modal-backdrop-fullscreen]="fullscreen" (click)="close()">
  <div
    class="modal-panel surface"
    [class.modal-panel-wide]="wide"
    [class.modal-panel-fullscreen]="fullscreen"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <ng-content select="[modal-title]"
        ><h3>{{ title }}</h3></ng-content
      >
      <div class="modal-header-actions">
        <ng-content select="[modal-header-actions]"></ng-content>
        <button
          type="button"
          class="btn btn-ghost btn-sm modal-close"
          (click)="close()"
          [attr.aria-label]="'common.close' | translate"
        >
          ✕
        </button>
      </div>
    </div>
    <div class="modal-body">
      <ng-content></ng-content>
    </div>
    <div class="modal-footer">
      <ng-content select="[modal-footer]"></ng-content>
    </div>
  </div>
</div>
