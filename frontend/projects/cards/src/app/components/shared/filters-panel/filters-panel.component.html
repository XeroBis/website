@if (open && !inline) {
  <div class="filters-backdrop" (click)="close.emit()"></div>
}
<aside class="filters-panel" [class.open]="open" [class.filters-panel-inline]="inline">
  <div class="filters-header">
    <span>{{ 'filters.title' | translate }}</span>
    <span class="card-count">{{ cardCountLabel }}</span>
    @if (!inline) {
      <button
        type="button"
        class="btn btn-ghost btn-sm filters-close-btn"
        [attr.aria-label]="'filters.close' | translate"
        (click)="close.emit()"
      >
        ✕
      </button>
    }
  </div>

  <div class="filters">
    <input
      #searchInput
      type="text"
      class="input"
      [placeholder]="'filters.searchPlaceholder' | translate"
      [title]="'filters.searchHint' | translate"
      [ngModel]="search"
      (ngModelChange)="onSearchChange($event)"
    />
    @if (showSetTextFilter) {
      <input
        type="text"
        class="input"
        [placeholder]="'filters.filterSetsPlaceholder' | translate"
        [ngModel]="setFilter"
        (ngModelChange)="onSetFilterChange($event)"
      />
    }
    <select class="select" [ngModel]="setCode" (ngModelChange)="onSetCodeChange($event)">
      <option value="">{{ 'filters.allSets' | translate }}</option>
      @for (set of showSetTextFilter ? filteredSets : sets; track set.set_code) {
        <option [value]="set.set_code">{{ set.set_name }}</option>
      }
    </select>
    <div class="filter-group">
      <span class="filter-group-label">{{ 'filters.cardType' | translate }}</span>
      <div class="type-toggle-row">
        @for (st of cardTypes; track st) {
          <button
            type="button"
            class="type-toggle-btn"
            [class.active]="isSupertypeActive(st)"
            (click)="toggleSupertype(st)"
          >
            {{ supertypeKey(st) | translate }}
          </button>
        }
      </div>
    </div>
    <app-print-filters
      [labeled]="true"
      [rarities]="rarities"
      [variants]="variantOptions"
      [variantLabel]="variantFilterLabel"
      [collapseVariants]="collapseVariants"
      [selectedRarities]="rarity"
      [selectedVariants]="variantType"
      (raritiesChange)="onRarityChange($event)"
      (variantsChange)="onVariantTypeChange($event)"
    />
    @if (showAvailableFilter) {
      <select class="select" [ngModel]="available" (ngModelChange)="onAvailableChange($event)">
        <option value="">{{ 'filters.allCards' | translate }}</option>
        <option value="available">{{ 'filters.available' | translate }}</option>
        <option value="unavailable">{{ 'filters.unavailable' | translate }}</option>
      </select>
    }
    <input
      type="text"
      class="input"
      [placeholder]="'filters.cardNumberPlaceholder' | translate"
      [ngModel]="cardNumber"
      (ngModelChange)="onCardNumberChange($event)"
    />
    <select class="select" [ngModel]="sort" (ngModelChange)="onSortChange($event)">
      @for (opt of sortOptions; track opt.value) {
        <option [value]="opt.value">
          {{ 'common.sortLabel' | translate: { label: ('sort.' + opt.value | translate) } }}
        </option>
      }
    </select>
    <button
      type="button"
      class="btn btn-ghost"
      [disabled]="!hasActiveFilters"
      (click)="clear.emit()"
    >
      {{ 'filters.clearFilters' | translate }}
    </button>
  </div>
</aside>
