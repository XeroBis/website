# Local dev stack. Host ports are offset from the old per-app repos' dev
# stacks (5432-5435 / 8000-8300 / 4200-4500) so both can run during the
# migration — see documentation/architecture.md "Local dev ports".
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: website
      POSTGRES_PASSWORD: website
      POSTGRES_DB: website
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U website -d website"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://website:website@db:5432/website
      LOG_LEVEL: DEBUG
      # Fixed fake secrets: dev only, never valid in prod (different .env).
      SECRET_KEY: dev-secret-key-not-for-production-0000
      REGISTER_SECRET: dev-register-secret
      # Cookies: no Domain (host-only on localhost, shared by every port), not
      # Secure (plain http).
      COOKIE_SECURE: "false"
      # Account created/updated by `make seed-user`.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password}
      ADMIN_PSEUDO: ${ADMIN_PSEUDO:-Admin}
      # Media: real TMDB token from the gitignored root .env; empty = film and
      # series search answer 502 (books need no key).
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      # Cards: downloaded scans, thumbnails, logos, variant badges (~2 GB).
      CARDS_DATA_DIR: /data/cards
    ports:
      - "8400:8000"
    volumes:
      - ./backend:/app
      - cards_data:/data/cards
    depends_on:
      db:
        condition: service_healthy

  # Every app's `ng serve` in one container (one per port), each proxying
  # /api to the backend — see frontend/proxy.conf.mjs.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_TARGET: http://backend:8000
      # Each `ng serve` takes ~1 GB of RAM; run only the apps you work on, e.g.
      # `make up APPS="cards auth"`.
      APPS: ${APPS:-portfolio workout cards media auth}
    ports:
      - "4600:4600" # portfolio
      - "4601:4601" # workout
      - "4602:4602" # cards
      - "4603:4603" # media
      - "4604:4604" # auth
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular
    depends_on:
      - backend

volumes:
  pgdata:
  cards_data:
