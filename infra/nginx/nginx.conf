# The edge: the only container on the VPS binding host ports 80/443. It
# terminates TLS, serves each app's prebuilt Angular bundle by Host header,
# and proxies /api on every host to the one backend (same-origin, no CORS —
# see documentation/decisions.md "API exposed as /api on every host").
# Replaces the old vps-edge repo plus each app's own frontend nginx.

# Docker's embedded DNS, used with a variable in proxy_pass (snippets/app.conf)
# so the edge still starts when the backend container isn't up yet — /api
# then 502s instead of nginx refusing to boot.
resolver 127.0.0.11 valid=10s;

# HTTP — ACME HTTP-01 challenges (certbot --webroot), everything else to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Non-canonical portfolio hosts → alanbignon.com.
server {
    listen 443 ssl;
    http2 on;
    server_name www.alanbignon.com alanbignon.fr www.alanbignon.fr;
    include /etc/nginx/snippets/tls.conf;

    return 301 https://alanbignon.com$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name alanbignon.com;
    set $app portfolio;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/app.conf;
}

