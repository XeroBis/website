# Proxy to the one backend, included by every /api location in app.conf. Its
# routes already carry the /api prefix, so the URI is forwarded unchanged.
# Auth is checked by the backend itself (session cookie), nothing is gated or
# injected here.
set $backend backend:8000;
proxy_pass http://$backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# The client's own X-Forwarded-For is replaced, not appended to: uvicorn
# (--forwarded-allow-ips='*') takes the header's first entry as the client
# IP, which the rate limits key on, so a forged one would dodge them.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_hide_header Server;
