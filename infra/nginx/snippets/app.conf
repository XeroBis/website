# Shared by every app's server block. Expects `$app` to be set to the app's
# name, which is also its folder under /usr/share/nginx/html (see Dockerfile).

root /usr/share/nginx/html/$app;
index index.html;

# The one backend. Its routes already carry the /api prefix, so the URI is
# forwarded unchanged. Auth is checked by the backend itself (session cookie),
# nothing is gated or injected here.
location /api/ {
    set $backend backend:8000;
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header Server;
    client_max_body_size 20m;
}

# Hashed bundle files never change content under the same name.
location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header in a location replaces the server-level ones — repeat them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Angular client-side routing — unknown paths fall back to index.html, which
# must never be cached so a deploy is picked up on next load.
location / {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
}
