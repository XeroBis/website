# Shared by every app's server block. Expects `$app` to be set to the app's
# name, which is also its folder under /usr/share/nginx/html (see Dockerfile).

root /usr/share/nginx/html/$app;
index index.html;

# The one backend (see api-proxy.conf). `^~` so the static-file regex below
# never catches an API path ending in .jpg/.png/.svg (card images, badges).
location ^~ /api/ {
    include /etc/nginx/snippets/api-proxy.conf;
    client_max_body_size 20m;
}

# Cards' images import (admin): the raw zip (~2 GB) is passed on as it
# arrives, the backend writes it to disk. Exact match, so only this route.
location = /api/cards/catalog/import/images {
    include /etc/nginx/snippets/api-proxy.conf;
    client_max_body_size 4g;
    proxy_request_buffering off;
}

# ...and its export, streamed by the backend: passed on unbuffered rather
# than spooled to a temp file.
location = /api/cards/catalog/export/images {
    include /etc/nginx/snippets/api-proxy.conf;
    proxy_buffering off;
}

# Hashed bundle files never change content under the same name.
location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header in a location replaces the server-level ones — repeat them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Angular client-side routing — unknown paths fall back to index.html, which
# must never be cached so a deploy is picked up on next load.
location / {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
}
